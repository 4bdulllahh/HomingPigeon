name: Build Windows installer

# * every push / pull request: run the tests and check the installer still builds
# * publishing a release on GitHub: build HomingPigeon-vX.Y.zip and attach it to
#   that release automatically (takes about 5 minutes)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build the installer
        run: python tools/build_installer.py

      - name: Keep the build (downloadable from the Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: HomingPigeon-installer
          path: dist/HomingPigeon-*.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HomingPigeon-*.zip
