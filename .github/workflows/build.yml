name: Build Windows app

# Builds HomingPigeon.exe automatically.
#  * every push: checks the code still builds and the tests pass
#  * every tag like v0.1.0: also publishes the .exe on the Releases page,
#    which is where the README tells people to download it from.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build the executable
        run: python tools/build_exe.py

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: HomingPigeon
          path: dist/HomingPigeon.exe

      - name: Publish to Releases (tagged versions only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HomingPigeon.exe
          generate_release_notes: true
